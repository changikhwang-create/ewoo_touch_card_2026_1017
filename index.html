<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2026 이우 학부모축제 완벽 가이드 | 터치카드</title>

  <!-- 카카오톡, 페이스북, 밴드 링크 미리보기 (포스터 이미지 전용) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://changikhwang-create.github.io/ewoo_touch_card_2026_1017/">
  <meta property="og:title" content="2026 이우 학부모축제 스마트 터치카드">
  <meta property="og:description" content="카드를 탭하면 3D 플립으로 펼쳐지는 현장 완벽 가이드!">
  <meta property="og:image" content="https://changikhwang-create.github.io/ewoo_touch_card_2026_1017/poster.png">

  <!-- 트위터(X) 링크 미리보기 -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="2026 이우 학부모축제 스마트 터치카드">
  <meta name="twitter:description" content="카드를 탭하면 3D 플립으로 펼쳐지는 현장 완벽 가이드!">
  <meta name="twitter:image" content="https://changikhwang-create.github.io/ewoo_touch_card_2026_1017/poster.png">

  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    :root {
      --primary: #1e5f43;
      --accent: #ee6c4d;
      --bg: #f5f2eb;
      --card-radius: 10px;
      --card-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      --card-ratio: 1 / 1.42; /* 카드 실물 비율 (여백 잘림 방지) */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 8px 10px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    header {
      text-align: center;
      margin-bottom: 2px;
    }
    .badge {
      display: inline-block;
      background: #e3f0e8;
      color: var(--primary);
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 10px;
      margin-bottom: 2px;
    }
    h1 {
      font-size: 17px;
      font-weight: 800;
      color: #173d2c;
      letter-spacing: -0.4px;
      line-height: 1.2;
    }
    .hint-sub {
      font-size: 11.5px;
      color: #666;
      margin-top: 2px;
    }

    /* 4분할 2x2 그리드 */
    .grid-board {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .grid-card {
      position: relative;
      width: 100%;
      aspect-ratio: var(--card-ratio);
      border-radius: var(--card-radius);
      overflow: hidden;
      background: #ffffff;
      box-shadow: var(--card-shadow);
      border: 1px solid rgba(220, 215, 203, 0.8);
      cursor: pointer;
      display: flex;
      transition: transform 0.2s ease;
    }
    .grid-card:active {
      transform: scale(0.97);
    }
    
    .grid-card img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      pointer-events: none;
    }

    .tap-tag {
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.68);
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
      backdrop-filter: blur(4px);
      white-space: nowrap;
      pointer-events: none;
    }

    /* ================= 전체화면 3D 플립 모달 ================= */
    .fullscreen-modal {
      position: fixed;
      inset: 0;
      background: rgba(18, 25, 21, 0.92);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 12px 10px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }
    .fullscreen-modal.active {
      opacity: 1;
      visibility: visible;
    }

    .stage-3d {
      width: min(92vw, calc(80vh / 1.42));
      height: min(80vh, calc(92vw * 1.42));
      aspect-ratio: var(--card-ratio);
      perspective: 1400px;
      -webkit-perspective: 1400px;
    }

    .modal-card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      border-radius: 14px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      cursor: pointer;
    }

    /* [핵심] 터치 즉시 100% 확실하게 뒷면으로 촤라락 뒤집히는 키프레임 애니메이션 */
    .modal-card.animate-flip-in {
      animation: flipInToBack 0.52s cubic-bezier(0.2, 0.85, 0.25, 1) forwards;
    }

    @keyframes flipInToBack {
      0% {
        transform: scale(0.65) rotateY(0deg);
        -webkit-transform: scale(0.65) rotateY(0deg);
      }
      100% {
        transform: scale(1) rotateY(180deg);
        -webkit-transform: scale(1) rotateY(180deg);
      }
    }

    /* 수동 앞/뒤 토글 시 부드러운 회전 */
    .modal-card.is-front {
      transform: scale(1) rotateY(0deg);
      -webkit-transform: scale(1) rotateY(0deg);
      transition: transform 0.45s cubic-bezier(0.34, 1.4, 0.64, 1);
    }
    .modal-card.is-back:not(.animate-flip-in) {
      transform: scale(1) rotateY(180deg);
      -webkit-transform: scale(1) rotateY(180deg);
      transition: transform 0.45s cubic-bezier(0.34, 1.4, 0.64, 1);
    }

    /* 모달 카드 앞·뒷면 면체 설정 */
    .modal-card-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 14px;
      overflow: hidden;
      background: #ffffff;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      display: flex;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .modal-card-face img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    /* 3D 겹침 및 투과를 완벽히 막아주는 Z축 미세 분리 */
    .modal-card-front {
      transform: rotateY(0deg) translateZ(1px);
      -webkit-transform: rotateY(0deg) translateZ(1px);
    }

    .modal-card-back {
      transform: rotateY(180deg) translateZ(1px);
      -webkit-transform: rotateY(180deg) translateZ(1px);
    }

    .modal-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
    }
    .btn-action {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 7px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background 0.2s;
    }
    .btn-action:active {
      background: rgba(255, 255, 255, 0.35);
    }
    .btn-close {
      background: #ffffff;
      color: #111;
      border: none;
      font-weight: 800;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="badge">2026 이우 학부모축제 스마트 가이드</div>
    <h1>한눈에 보는 4분할 터치카드</h1>
    <div class="hint-sub">카드를 탭하면 3D 플립과 함께 전체화면으로 열립니다</div>
  </header>

  <!-- 4분할 그리드 -->
  <div class="grid-board">
    
    <div class="grid-card" onclick="openFlipFullscreen(0)">
      <img src="card1_front.png" alt="1번 앞면 카드">
      <div class="tap-tag">👆 탭하여 뒷면 보기</div>
    </div>

    <div class="grid-card" onclick="openFlipFullscreen(1)">
      <img src="card2_front.png" alt="2번 앞면 카드">
      <div class="tap-tag">👆 탭하여 뒷면 보기</div>
    </div>

    <div class="grid-card" onclick="openFlipFullscreen(2)">
      <img src="card3_front.png" alt="3번 앞면 카드">
      <div class="tap-tag">👆 탭하여 뒷면 보기</div>
    </div>

    <div class="grid-card" onclick="openFlipFullscreen(3)">
      <img src="card4_front.png" alt="4번 앞면 카드">
      <div class="tap-tag">👆 탭하여 뒷면 보기</div>
    </div>

  </div>
</div>

<!-- 전체화면 3D 플립 모달 -->
<div class="fullscreen-modal" id="modal" onclick="closeFullscreen()">
  <div class="stage-3d" onclick="event.stopPropagation()">
    <div class="modal-card" id="modal-card" onclick="toggleFlip()">
      
      <div class="modal-card-face modal-card-front">
        <img id="modal-img-front" src="" alt="앞면">
      </div>

      <div class="modal-card-face modal-card-back">
        <img id="modal-img-back" src="" alt="뒷면">
      </div>

    </div>
  </div>

  <div class="modal-controls" onclick="event.stopPropagation()">
    <button class="btn-action" onclick="toggleFlip()">
      <span id="flip-btn-icon">🔄</span> <span id="flip-btn-text">앞면 보기</span>
    </button>
    <button class="btn-action btn-close" onclick="closeFullscreen()">✕ 닫기</button>
  </div>
</div>

<script>
  const cardsData = [
    { front: 'card1_front.png', back: 'card1_back.png' },
    { front: 'card2_front.png', back: 'card2_back.png' },
    { front: 'card3_front.png', back: 'card3_back.png' },
    { front: 'card4_front.png', back: 'card4_back.png' }
  ];

  const modal = document.getElementById('modal');
  const modalCard = document.getElementById('modal-card');
  const imgFront = document.getElementById('modal-img-front');
  const imgBack = document.getElementById('modal-img-back');
  const flipBtnText = document.getElementById('flip-btn-text');

  let isBackSide = true;

  // 카드 터치 시: 타이머 지연 없이 CSS 키프레임 애니메이션 즉시 기동
  function openFlipFullscreen(index) {
    const data = cardsData[index];
    imgFront.src = data.front;
    imgBack.src = data.back;

    isBackSide = true;
    flipBtnText.innerText = '앞면 보기';

    // 클래스를 부여하는 순간 0도(앞) -> 180도(뒤)로 즉시 100% 확실하게 회전
    modalCard.className = 'modal-card is-back animate-flip-in';
    modal.classList.add('active');
  }

  // 모달 내부에서 터치 시 앞/뒤 토글
  function toggleFlip() {
    modalCard.classList.remove('animate-flip-in');
    
    isBackSide = !isBackSide;
    if (isBackSide) {
      modalCard.className = 'modal-card is-back';
      flipBtnText.innerText = '앞면 보기';
    } else {
      modalCard.className = 'modal-card is-front';
      flipBtnText.innerText = '뒷면 보기';
    }
  }

  // 닫기
  function closeFullscreen() {
    modal.classList.remove('active');
    modalCard.className = 'modal-card';
  }
</script>

</body>
</html>
