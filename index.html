<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2026 이우 학부모축제 완벽 가이드 | 터치카드</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    :root {
      --primary: #1e5f43;
      --primary-light: #4ea87d;
      --primary-dark: #113827;
      --accent-coral: #ee6c4d;
      --accent-amber: #f4a261;
      --bg-cream: #faf7f2;
      --text-main: #222222;
      --text-sub: #555555;
      --shadow-soft: 0 14px 34px rgba(30, 95, 67, 0.09), 0 6px 14px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background-color: var(--bg-cream);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 18px 16px 28px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* Header */
    header {
      text-align: center;
      margin-top: 4px;
    }
    .badge-top {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #e7f3ec;
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 20px;
      margin-bottom: 6px;
      border: 1px solid rgba(78, 168, 125, 0.25);
    }
    h1 {
      font-size: 21px;
      font-weight: 800;
      color: var(--primary-dark);
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 3px;
    }

    /* Status & Progress */
    .status-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 6px;
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
    }
    .progress-track {
      flex: 1;
      height: 7px;
      background: #e8e3d8;
      border-radius: 4px;
      margin: 0 12px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary-light), var(--primary));
      width: 14.28%;
      transition: width 0.35s ease;
      border-radius: 4px;
    }

    /* 3D Flip Card Scene */
    .card-scene {
      width: 100%;
      height: 485px;
      perspective: 1200px;
      -webkit-perspective: 1200px;
      cursor: pointer;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      border-radius: 26px;
      box-shadow: var(--shadow-soft);
    }

    .card.is-flipped {
      transform: rotateY(180deg);
      -webkit-transform: rotateY(180deg);
    }

    /* Card Faces */
    .card-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 26px;
      padding: 26px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-color: #ffffff;
      /* 포스터를 투명도 88%의 흰색 레이어로 감싸 은은한 워터마크 효과 구현 */
      background-image: linear-gradient(rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.88)), url('poster.png');
      background-size: cover;
      background-position: center 30%;
      border: 1.5px solid rgba(220, 215, 203, 0.7);
      overflow: hidden;
    }

    .card-face-front {
      transform: rotateY(0deg);
      -webkit-transform: rotateY(0deg);
    }

    .card-face-back {
      transform: rotateY(180deg);
      -webkit-transform: rotateY(180deg);
      border-top: 5px solid var(--primary);
    }

    /* 모바일 브라우저 투과 및 잔상 버그 방지 락 */
    .card.is-flipped .card-face-front {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease 0.1s;
    }
    .card:not(.is-flipped) .card-face-front {
      opacity: 1;
      transition: opacity 0.2s ease 0.3s;
    }
    .card.is-flipped .card-face-back {
      opacity: 1;
      transition: opacity 0.2s ease 0.3s;
    }
    .card:not(.is-flipped) .card-face-back {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease 0.1s;
    }

    /* Front Card (Question) */
    .front-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .tag {
      background: #eef6f1;
      color: var(--primary);
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 800;
      border-radius: 14px;
      letter-spacing: -0.2px;
    }
    .badge-step {
      font-size: 13px;
      font-weight: 800;
      color: #9aa89f;
    }

    .front-center {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 0;
    }

    .illustration-wrap {
      width: 120px;
      height: 120px;
      background: #ffffff;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.06), 0 2px 6px rgba(0, 0, 0, 0.03);
      margin-bottom: 22px;
      border: 1.5px solid #f1ece1;
      transition: transform 0.3s ease;
    }
    .card-scene:hover .illustration-wrap {
      transform: scale(1.06) rotate(-2deg);
    }
    .illustration-wrap svg {
      width: 76px;
      height: 76px;
    }

    .question-title {
      font-size: 21px;
      font-weight: 800;
      line-height: 1.45;
      color: #1a1a1a;
      letter-spacing: -0.6px;
    }

    .tap-hint {
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-coral);
      background: rgba(238, 108, 77, 0.08);
      padding: 11px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      animation: pulseAnim 2.2s infinite;
    }

    /* Back Card (Answer) */
    .back-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.07);
    }
    .badge-ans {
      background: var(--primary);
      color: white;
      font-weight: 800;
      font-size: 13px;
      padding: 4px 9px;
      border-radius: 8px;
    }
    .back-header h3 {
      font-size: 17px;
      font-weight: 800;
      color: var(--primary-dark);
      letter-spacing: -0.4px;
    }

    .back-content {
      flex: 1;
      padding: 14px 2px;
      display: flex;
      flex-direction: column;
      gap: 11px;
      overflow-y: auto;
    }
    .info-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-size: 13.5px;
      line-height: 1.5;
      color: #333333;
    }
    .item-bullet {
      width: 20px;
      height: 20px;
      background: #ebf5ee;
      color: var(--primary);
      font-size: 12px;
      font-weight: 800;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .info-item strong {
      color: #123d29;
      font-weight: 700;
    }
    .tip-box {
      background: rgba(244, 162, 97, 0.12);
      border-left: 3px solid var(--accent-amber);
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.45;
      color: #7a461b;
      margin-top: 2px;
    }
    .tap-hint-back {
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: #8c857b;
      padding-top: 8px;
    }

    /* Navigation Controls */
    .controls {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 10px;
      margin-top: 2px;
    }
    .btn {
      padding: 14px;
      border-radius: 16px;
      border: none;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-prev {
      background: #e8e3d8;
      color: #4a453e;
    }
    .btn-next {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 14px rgba(30, 95, 67, 0.25);
    }
    .btn:active {
      transform: scale(0.97);
    }

    /* Indicator Dots */
    .dots {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-top: 2px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #dcd6c9;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .dot.active {
      width: 22px;
      border-radius: 4px;
      background: var(--primary);
    }

    @keyframes pulseAnim {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.985); opacity: 0.85; }
    }
  </style>
</head>

  let currentIndex = 0;
  const cardElement = document.getElementById("card");

  function renderCard(index) {
    const data = cardsData[index];

    // Status bar & Progress
    document.getElementById("card-category").innerText = data.category;
    document.getElementById("card-counter").innerText = `${index + 1} / ${cardsData.length}`;
    document.getElementById("progress-fill").style.width = `${((index + 1) / cardsData.length) * 100}%`;

    // Front Face
    document.getElementById("card-tag").innerText = data.tag;
    document.getElementById("card-step-num").innerText = data.stepNum;
    document.getElementById("illustration-box").innerHTML = data.svgIcon;
    document.getElementById("card-question").innerHTML = data.question;

    // Back Face
    document.getElementById("card-back-title").innerText = data.backTitle;
    const backContentContainer = document.getElementById("card-back-content");
    backContentContainer.innerHTML = "";

    data.items.forEach(item => {
      const row = document.createElement("div");
      row.className = "info-item";
      row.innerHTML = `<span class="item-bullet">${item.num}</span><span>${item.text}</span>`;
      backContentContainer.appendChild(row);
    });

    if (data.tip) {
      const tipDiv = document.createElement("div");
      tipDiv.className = "tip-box";
      tipDiv.innerText = data.tip;
      backContentContainer.appendChild(tipDiv);
    }

    updateDots();
  }

  function flipCard() {
    cardElement.classList.toggle("is-flipped");
  }

  function prevCard(e) {
    e.stopPropagation();
    if (currentIndex > 0) {
      cardElement.classList.remove("is-flipped");
      setTimeout(() => {
        currentIndex--;
        renderCard(currentIndex);
      }, 140);
    }
  }

  function nextCard(e) {
    e.stopPropagation();
    if (currentIndex < cardsData.length - 1) {
      cardElement.classList.remove("is-flipped");
      setTimeout(() => {
        currentIndex++;
        renderCard(currentIndex);
      }, 140);
    }
  }

  function initDots() {
    const dotsContainer = document.getElementById("dots-container");
    dotsContainer.innerHTML = "";
    cardsData.forEach((_, idx) => {
      const dot = document.createElement("div");
      dot.className = `dot ${idx === 0 ? 'active' : ''}`;
      dot.onclick = (e) => {
        e.stopPropagation();
        cardElement.classList.remove("is-flipped");
        setTimeout(() => {
          currentIndex = idx;
          renderCard(currentIndex);
        }, 140);
      };
      dotsContainer.appendChild(dot);
    });
  }

  function updateDots() {
    const dots = document.querySelectorAll(".dot");
    dots.forEach((dot, idx) => {
      dot.className = `dot ${idx === currentIndex ? 'active' : ''}`;
    });
  }

  // Init
  initDots();
  renderCard(currentIndex);
</script>
