<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2026 이우 학부모축제 4분할 터치카드</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    :root {
      --primary: #1e5f43;
      --accent: #ee6c4d;
      --bg: #f5f2eb;
      --card-radius: 12px;
      --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px 10px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    /* 헤더 */
    header {
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #e3f0e8;
      color: var(--primary);
      font-size: 11px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 12px;
      margin-bottom: 2px;
    }
    h1 {
      font-size: 18px;
      font-weight: 800;
      color: #173d2c;
      letter-spacing: -0.4px;
    }
    .hint-sub {
      font-size: 12px;
      color: #666;
      margin-top: 2px;
    }

    /* 4분할 2x2 그리드 */
    .grid-board {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }

    /* 개별 썸네일 카드: 이미지 비율에 최적화된 9/16 비율 */
    .grid-card {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 16;
      border-radius: var(--card-radius);
      overflow: hidden;
      background: #ffffff;
      box-shadow: var(--card-shadow);
      border: 1.5px solid rgba(220, 215, 203, 0.7);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }
    .grid-card:active {
      transform: scale(0.97);
    }
    
    /* 잘림 방지: contain 적용 */
    .grid-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    .tap-tag {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 14px;
      backdrop-filter: blur(4px);
      white-space: nowrap;
      pointer-events: none;
    }

    /* ================= 전체화면 3D 플립 모달 ================= */
    .fullscreen-modal {
      position: fixed;
      inset: 0;
      background: rgba(18, 25, 21, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px 12px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .fullscreen-modal.active {
      opacity: 1;
      visibility: visible;
    }

    /* 화면 높이와 너비를 자동 계산하여 상하좌우가 온전히 유지되는 무대 */
    .stage-3d {
      width: min(88vw, calc(78vh * 9 / 16));
      height: min(78vh, calc(88vw * 16 / 9));
      aspect-ratio: 9 / 16;
      perspective: 1400px;
      -webkit-perspective: 1400px;
    }

    .modal-card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      -webkit-transform-style: preserve-3d;
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      transition: transform 0.65s cubic-bezier(0.34, 1.5, 0.64, 1);
      cursor: pointer;
    }

    .modal-card.is-closed {
      transform: scale(0.6) rotateY(0deg);
      transition: none;
    }
    .modal-card.is-back {
      transform: scale(1) rotateY(180deg);
      -webkit-transform: rotateY(180deg);
    }
    .modal-card.is-front {
      transform: scale(1) rotateY(0deg);
      -webkit-transform: rotateY(0deg);
    }

    .modal-card-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 16px;
      overflow: hidden;
      background: #faf8f5;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* 전체화면에서도 외곽선/글씨가 잘리지 않도록 contain 적용 */
    .modal-card-face img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      user-select: none;
    }

    /* 앞·뒷면 투과 방지 락 */
    .modal-card-front {
      transform: rotateY(0deg);
      -webkit-transform: rotateY(0deg);
      z-index: 2;
    }
    .modal-card.is-back .modal-card-front {
      visibility: hidden;
      opacity: 0;
      transition: visibility 0s 0.25s, opacity 0.2s linear;
    }
    .modal-card.is-front .modal-card-front {
      visibility: visible;
      opacity: 1;
      transition: opacity 0.2s linear 0.1s;
    }

    .modal-card-back {
      transform: rotateY(180deg);
      -webkit-transform: rotateY(180deg);
      z-index: 1;
    }
    .modal-card.is-back .modal-card-back {
      visibility: visible;
      opacity: 1;
      transition: opacity 0.2s linear 0.1s;
    }
    .modal-card.is-front .modal-card-back {
      visibility: hidden;
      opacity: 0;
      transition: visibility 0s 0.25s, opacity 0.2s linear;
    }

    /* 하단 버튼 */
    .modal-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
    }
    .btn-action {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background 0.2s;
    }
    .btn-action:active {
      background: rgba(255, 255, 255, 0.35);
    }
    .btn-close {
      background: #ffffff;
      color: #111;
      border: none;
      font-weight: 800;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="badge">2026 이우 학부모축제 스마트 가이드</div>
    <h1>한눈에 보는 4분할 터치카드</h1>
    <div class="hint-sub">카드를 탭하면 3D 플립과 함께 전체화면으로 열립니다</div>
  </header>

  <!-- 4분할 그리드 -->
  <div class="grid-board">
    
    <!-- 1구역: 축제 포스터 -->
    <div class="grid-card" onclick="openFlipFullscreen(0)">
      <img src="card1_front.png" alt="축제 포스터">
      <div class="tap-tag">👆 탭하여 뒷면 보기</div>
    </div>

    <!-- 2구역: #2 일정표 -->
    <div class="grid-card" onclick="openFlipFullscreen(1)">
      <img src="card2_front.png" alt="#2 일정표">
      <div class="tap-tag">👆 탭하여 뒷면 보기</div>
    </div>

    <!-- 3구역: #4 먹거리 -->
    <div class="grid-card" onclick="openFlipFullscreen(2)">
      <img src="card3_front.png" alt="#4 먹거리 안내">
      <div class="tap-tag">👆 탭하여 뒷면 보기</div>
    </div>

    <!-- 4구역: #6 무대공연 -->
    <div class="grid-card" onclick="openFlipFullscreen(3)">
      <img src="card4_front.png" alt="#6 무대공연">
      <div class="tap-tag">👆 탭하여 뒷면 보기</div>
    </div>

  </div>
</div>

<!-- ================= 전체화면 3D 플립 모달 ================= -->
<div class="fullscreen-modal" id="modal" onclick="closeFullscreen()">
  <div class="stage-3d" onclick="event.stopPropagation()">
    <div class="modal-card is-closed" id="modal-card" onclick="toggleFlip()">
      
      <!-- 모달 카드 앞면 -->
      <div class="modal-card-face modal-card-front">
        <img id="modal-img-front" src="" alt="앞면">
      </div>

      <!-- 모달 카드 뒷면 -->
      <div class="modal-card-face modal-card-back">
        <img id="modal-img-back" src="" alt="뒷면">
      </div>

    </div>
  </div>

  <!-- 컨트롤 버튼 -->
  <div class="modal-controls" onclick="event.stopPropagation()">
    <button class="btn-action" onclick="toggleFlip()">
      <span id="flip-btn-icon">🔄</span> <span id="flip-btn-text">앞면 보기</span>
    </button>
    <button class="btn-action btn-close" onclick="closeFullscreen()">✕ 닫기</button>
  </div>
</div>

<script>
  const cardsData = [
    { front: 'card1_front.png', back: 'card1_back.png' }, // 포스터 ↔ #1 오프닝
    { front: 'card2_front.png', back: 'card2_back.png' }, // #2 일정표 ↔ #3 공간배치도
    { front: 'card3_front.png', back: 'card3_back.png' }, // #4 먹거리 ↔ #5 볼거리/놀거리
    { front: 'card4_front.png', back: 'card4_back.png' }  // #6 무대공연 ↔ #7 기타안내
  ];

  const modal = document.getElementById('modal');
  const modalCard = document.getElementById('modal-card');
  const imgFront = document.getElementById('modal-img-front');
  const imgBack = document.getElementById('modal-img-back');
  const flipBtnText = document.getElementById('flip-btn-text');

  let isBackSide = true;

  function openFlipFullscreen(index) {
    const data = cardsData[index];
    imgFront.src = data.front;
    imgBack.src = data.back;

    modalCard.className = 'modal-card is-closed';
    modal.classList.add('active');

    requestAnimationFrame(() => {
      setTimeout(() => {
        modalCard.className = 'modal-card is-back';
        isBackSide = true;
        flipBtnText.innerText = '앞면 보기';
      }, 20);
    });
  }

  function toggleFlip() {
    isBackSide = !isBackSide;
    if (isBackSide) {
      modalCard.className = 'modal-card is-back';
      flipBtnText.innerText = '앞면 보기';
    } else {
      modalCard.className = 'modal-card is-front';
      flipBtnText.innerText = '뒷면 보기';
    }
  }

  function closeFullscreen() {
    modalCard.className = 'modal-card is-closed';
    modal.classList.remove('active');
  }
</script>

</body>
</html>
